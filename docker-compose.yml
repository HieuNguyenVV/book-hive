services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-book-hive
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_hive
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d book_hive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - book-hive-network

  migrator:
    build:
      context: .
      dockerfile: migrate.dockerfile
    container_name: migrator-book-hive
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure:6
    environment:
      # Inside Docker network Postgres listens on 5432.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/book_hive?sslmode=disable
    networks:
      - book-hive-network

  redis:
    image: redis:7-alpine
    container_name: redis-book-hive
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - book-hive-network

volumes:
  postgres_data:

networks:
  book-hive-network:
    driver: bridge
