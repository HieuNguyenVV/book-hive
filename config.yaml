app:
  env: development
  port: "8080"
  host: localhost
  debug: true
  api_version: v1
  api_prefix: /api

log:
  log_level: debug

postgres:
  master:
    host: localhost
    port: "5439"
    user: postgres
    password: postgres
    database: book_hive
    ssl_mode: disable
    max_open_conns: 25
    max_idle_conns: 5
  slaves:
    host: localhost
    port: "5439"
    user: postgres
    password: postgres
    database: book_hive
    ssl_mode: disable
    max_open_conns: 25
    max_idle_conns: 5

redis:
  host: localhost
  port: "6379"
  password: ""
  db: 0

jwt:
  access_token_secret: change-me-in-production
  access_token_ttl: 900      # 15 minutes
  refresh_token_ttl: 604800  # 7 days
