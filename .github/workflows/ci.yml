name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
      - "fix/**"
      - "chore/**"
      - "refactor/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: 1.25.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v2
       
        - uses: actions/setup-go@v2
          with:
            go-version: ${{ env.GO_VERSION }}
            cache: true

        - name: Format 
          run: |
            files=$(gofmt -l .)
            if [ -n "$files" ]; then
              echo "gofmt errors in the following files:"
              echo "$files"
              exit 1
            fi

        - name: Vet
          run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: |
          go test ./...
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o app ./cmd/server

      - name: Verify binary
        run: |
          file app
          ls -lah app
      - uses: actions/upload-artifact@v2
        with:
          name: app
          path: app
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Security Scan
        run: gosec ./...
      - name: Vulnerability Scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  final-checks:
    name: Final Checks
    runs-on: ubuntu-latest
    needs: [lint, test, build, security-scan]
    if: |
      always() && !cancelled() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.security-scan.result == 'success'
    steps:
      - run: echo "All checks passed"